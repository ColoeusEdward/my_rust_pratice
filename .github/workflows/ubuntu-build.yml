name: Ubuntu Build

# 手动触发（可被本机 `gh workflow run` 触发）。
# 注意：workflow_dispatch 仅在“默认分支(main)”上存在此文件时才可被 gh/API 触发；
#       而实际编译哪个分支的代码，取决于触发时 `--ref` 指定的分支（需该分支也含此文件）。
on:
  workflow_dispatch:
    inputs:
      profile:
        description: '构建类型 (release / debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    # 在 ubuntu-latest 托管 runner 上,用 debian:buster 容器编译。
    # buster 的 glibc 为 2.28、OpenSSL 为 1.1.1,与目标部署系统
    # (Ubuntu 18.10, glibc 2.28 / OpenSSL 1.1.1)一致 —— glibc/OpenSSL
    # 均不向前兼容,故必须用不高于目标机的版本编译。
    runs-on: ubuntu-latest
    container:
      image: debian:buster
    steps:
      # buster 已 EOL(2024 年停止支持),官方源 deb.debian.org 已下线,
      # 需切到 archive.debian.org,并关闭 Valid-Until 过期检查。
      - name: Fix apt sources (buster is EOL)
        run: |
          rm -f /etc/apt/sources.list.d/*.list
          printf '%s\n' \
            'deb http://archive.debian.org/debian buster main' \
            'deb http://archive.debian.org/debian-security buster/updates main' \
            > /etc/apt/sources.list

      # 裸 debian 容器以 root 运行且无 sudo,先装齐基础工具:
      #   git/ca-certificates/curl -> checkout 与 rustup 安装所需
      #   build-essential          -> gcc/g++/make + libc6-dev(提供 CRT 对象
      #                               Scrt1.o/crti.o 及 libc/libm/libpthread 等,
      #                               链接必需;裸 gcc 因 --no-install-recommends
      #                               不会拉入 libc6-dev,故用 build-essential)
      #   pkg-config               -> pkg-config 探测
      #   libasound2-dev(ALSA)     -> rodio;  libssl-dev(OpenSSL) -> reqwest native-tls
      - name: Install system deps
        run: |
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libasound2-dev libssl-dev

      # buster 的 glibc 为 2.28,checkout@v4(Node20)在此常因 GLIBC 版本报错,
      # 改用 checkout@v3(Node16)以保证在旧容器内可运行。
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
          profile: minimal
          toolchain: stable

      - name: Build
        id: build
        run: |
          if [ "${{ inputs.profile }}" = "debug" ]; then
            cargo build
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          else
            cargo build --release
            echo "dir=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello_cargo-ubuntu-${{ inputs.profile }}
          path: target/${{ steps.build.outputs.dir }}/hello_cargo
          if-no-files-found: error
